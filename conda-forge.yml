azure:
  max_parallel: 25
bot:
  automerge: true
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
test: native_and_emulated
conda_build_tool: rattler-build
conda_install_tool: pixi
workflow_settings:
  free_disk_space: quick
  pagefile_size:
    - os: linux
      value: 15
    - os: win
      value: 16
  build_workspace_dir:
    - provider: azure
      os: win
      value: C:\\bld\\
provider:
  linux_aarch64: default
  osx_arm64: default
